name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/voicestudio/app app/src/main/assets app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoiceStudio"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.voicestudio.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.voicestudio.app"
              minSdk 29
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="Voice Studio"
              android:icon="@drawable/ic_launcher"
              android:allowBackup="true"
              android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:windowSoftInputMode="adjustResize"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#5B3DF5" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M30,48h8v12h-8z M42,38h8v32h-8z M54,30h8v48h-8z M66,42h8v24h-8z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/voicestudio/app/MainActivity.java <<'EOF'
          package com.voicestudio.app;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
            WebView web;
            final Handler ui = new Handler(Looper.getMainLooper());

            void toast(final String s) {
              ui.post(new Runnable() {
                public void run() { Toast.makeText(MainActivity.this, s, Toast.LENGTH_LONG).show(); }
              });
            }

            class Bridge {
              OutputStream os;
              String name;

              @JavascriptInterface
              public void begin(String n) {
                try {
                  name = n;
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, n);
                  v.put(MediaStore.Downloads.MIME_TYPE, "audio/wav");
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/VoiceStudio");
                  ContentResolver cr = getContentResolver();
                  Uri u = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  os = cr.openOutputStream(u);
                } catch (Exception e) {
                  os = null;
                  toast("Save failed: " + e.getMessage());
                }
              }

              @JavascriptInterface
              public void chunk(String b64) {
                try {
                  if (os != null) os.write(Base64.decode(b64, Base64.DEFAULT));
                } catch (Exception e) {
                  toast("Save failed: " + e.getMessage());
                }
              }

              @JavascriptInterface
              public void end() {
                try {
                  if (os != null) {
                    os.close();
                    os = null;
                    toast("Saved: Download/VoiceStudio/" + name);
                  }
                } catch (Exception e) {
                  toast("Save failed: " + e.getMessage());
                }
              }
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();
              web.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
              });
              web.setWebChromeClient(new WebChromeClient());
              web.addJavascriptInterface(new Bridge(), "AB");
              web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: voice-studio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Voice Studio v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
